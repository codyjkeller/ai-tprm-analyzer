[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # keep typing.Optional style for Python 3.10 readers

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]
