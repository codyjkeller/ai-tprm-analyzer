# --- CONFIGURATION ---
scoring_matrix:
  starting_score: 100
  thresholds:
    low_risk: {min: 90, label: "✅ LOW RISK (Auto-Approve)"}
    medium_risk: {min: 70, label: "⚠️ MEDIUM RISK (Manual Review)"}
    high_risk: {min: 0, label: "🚫 HIGH RISK (Reject)"}
  
  # If a Critical Flag is triggered, override score to 0 immediately
  critical_override: true

# Select which standards to enforce for this assessment.
active_frameworks:
  - "nist_800_53_r5"
  - "cjis_policy"
  # - "iso_27001"
  
# --- FRAMEWORK DEFINITIONS ---
frameworks:

  # 1. NIST SP 800-53 Revision 5 (Federal/High Assurance)
  nist_800_53_r5:
    ac_control:
      id: "AC-2"
      domain: "Access Control"
      required: true
      weight: 20
      description: "Automated system account management."
      acceptable_answers: ["Automated provisioning", "IdP Integration"]
    
    ia_control:
      id: "IA-2(1), IA-2(2)"
      domain: "Identification & Authentication"
      required: true
      weight: 25
      description: "Multi-Factor Authentication for non-privileged and privileged accounts."
      acceptable_answers: ["MFA Enforced", "PIV/CAC"]
      critical_flag: "MFA not enforced"

  # 2. CJIS Security Policy v6.1 (Law Enforcement), published 2026-06-25
  # Control IDs follow the modernized, NIST 800-53-aligned structure used
  # since v6.0. Source: FBI Requirements Companion Document v6.1.
  cjis_policy:
    mfa_privileged:
      id: "IA-2(1)"
      domain: "MFA for Privileged Accounts"
      required: true
      weight: 15
      description: "Multi-factor authentication for access to privileged accounts (CJIS Priority 1)."
      acceptable_answers: ["MFA Enforced", "Multi-factor authentication", "PIV/CAC"]
      critical_flag: "MFA not enforced for privileged accounts"

    mfa_non_privileged:
      id: "IA-2(2)"
      domain: "MFA for Non-Privileged Accounts"
      required: true
      weight: 15
      description: "Multi-factor authentication for access to non-privileged accounts (CJIS Priority 1)."
      acceptable_answers: ["MFA Enforced", "Multi-factor authentication", "PIV/CAC"]
      critical_flag: "MFA not enforced for non-privileged accounts"

    encryption_in_transit:
      id: "SC-13"
      domain: "Encryption in Transit"
      required: true
      weight: 15
      description: "CJI in transit outside a physically secure location is encrypted with FIPS 140-3 certified modules or FIPS 197 (AES), with a symmetric key of at least 256 bits."
      acceptable_answers: ["FIPS 140-3", "AES-256"]
      # FIPS 140-2 certificates are not acceptable after 2026-09-21.
      forbidden_terms: ["Non-FIPS", "DES", "3DES", "RC4", "AES-128", "128-bit", "FIPS 140-2"]

    encryption_at_rest:
      id: "SC-28"
      domain: "Encryption at Rest"
      required: true
      weight: 10
      description: "CJI at rest outside a physically secure location is encrypted with FIPS 140-3 certified modules or FIPS 197 (AES), with a symmetric key of at least 256 bits."
      acceptable_answers: ["FIPS 140-3", "AES-256"]

  # 3. CIS Benchmarks v8 (Cyber Hygiene)
  cis_level_1:
    inventory:
      id: "CIS 1.1"
      domain: "Asset Inventory"
      required: true
      weight: 15
      description: "Active discovery of enterprise assets."
      acceptable_answers: ["Automated Asset Discovery", "MDM"]
  
  cis_level_2:
    data_protection:
      id: "CIS 3.11"
      domain: "Data Protection"
      required: true
      weight: 20
      description: "Encrypt sensitive data at rest."
      acceptable_answers: ["Encrypted"]

  # 4. ISO/IEC 27001:2022 (International)
  iso_27001:
    annex_a_5:
      id: "A.5.7"
      domain: "Threat Intelligence"
      required: false
      weight: 10
      description: "Collection and analysis of threat info."
      acceptable_answers: ["Threat Feed", "ISAC Member"]

  # 5. COSO (Enterprise Risk - Governance)
  coso_2013:
    governance:
      id: "Principle 1"
      domain: "Control Environment"
      required: true
      weight: 15
      description: "Demonstrates commitment to integrity and ethical values."
      acceptable_answers: ["Code of Conduct", "Ethics Policy"]
